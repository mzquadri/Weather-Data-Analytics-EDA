[project]
name = "weather-data-analysis"
version = "0.1.0"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
# CI runs 3.11. Without this, syntax that only parses on a newer
# interpreter passes locally and fails there.
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "RUF", "FURB"]

[tool.ruff.lint.per-file-ignores]
# Puts the repository root on sys.path before importing from it.
"scripts/figures/generate_figures.py" = ["E402"]
