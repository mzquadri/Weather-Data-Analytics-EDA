name: Repository check

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff

      - name: Lint
        run: ruff check .

      # data/*.csv is gitignored, so the record is rebuilt from the seed on a
      # clean checkout. Everything below depends on that being deterministic.
      - name: Regenerate the record
        run: python -m src.generate_data

      # The four docs figures used to be listed here by name, and the twelve under
      # results/figures were not checked at all. scripts/check_repository.py now counts
      # both directories and compares the matplotlib version recorded inside every PNG,
      # which catches a deleted figure and a half-regenerated set, not just a missing one.

      # The tests rebuild the summary in memory and compare it against the
      # committed results/summary.json section by section, so this is the
      # reproducibility check. src.summary is deliberately not run first: that
      # would overwrite the artifact being compared against.
      - name: Tests
        run: python -m unittest discover -s tests -v

      - name: Verify the README against results/summary.json
        run: python scripts/check_repository.py

      - name: Regenerate the figures
        run: python scripts/figures/generate_figures.py
